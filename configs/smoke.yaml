# Tiny synthetic PIPELINE check. These settings cannot establish image quality.
model:
  width: 4
  blocks: 1
train:
  steps: 3
  global_episodes: 4
  seed: 42
  learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_steps: 0
  max_grad_norm: 1.0
  temperatures: [0.2, 0.05, 0.02]
  distance_weight: 0.1
  mask_ratio: 0.5
  mask_patch_size: 4
  log_every: 1
  eval_every: 1
  save_every: 1
  validation_episodes: 2
  threads: 2
