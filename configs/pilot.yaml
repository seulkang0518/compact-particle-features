# One episode = 16 generated queries + 32 real references, from ONE class.
model:
  width: 64
  blocks: 2
train:
  steps: 5000
  global_episodes: 4
  seed: 42
  learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_steps: 250
  max_grad_norm: 1.0
  temperatures: [0.2, 0.05, 0.02]
  distance_weight: 0.1
  mask_ratio: 0.5
  mask_patch_size: 4
  log_every: 10
  eval_every: 250
  save_every: 250
  validation_episodes: 32
  threads: 4
